  button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; }
  .btn-red { background: #F04438; color: #FFF; }
  .btn-live { background: #262626; color: #FBBF24; border: 1px solid #524118; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
  .sum { display: grid; grid-template-columns: 1fr 1fr 1fr; background: #1A1A1A; padding: 12px; border-radius: 10px; margin-bottom: 10px; text-align: center; }
  .row { display: grid; grid-template-columns: 3.4fr 2.4fr 2fr 2.4fr; align-items: center; padding: 12px 4px; border-bottom: 1px solid #262626; font-size: 14px; }
</style>
</head>

<div class="bar">

<div class="box">

    <input type="text" id="inCode" class="hl" list="cOpts" placeholder="輸入代號 (如: 3714)">

  <div class="btns">

  </div>

<div id="tabs" class="tabs"></div>

<div class="sum">

  <div><div style="font-size:11px;color:#888;">股票市值</div><div id="sVal" style="font-size:17px;font-weight:bold;">0</div></div>

<div style="display:grid;grid-template-columns:3.4fr 2.4fr 2fr 2.4fr;padding:6px;border-bottom:1px solid #333;color:#888;font-size:12px;">

var elPrev = document.getElementById('inPrev');
var timer = null;

// 單筆連網抓最新收盤價 (支援 CORS，含 3 秒逾時保護)
function fetchPrice(code) {
  if (!code || code.length < 4) return;
  clearTimeout(timer);
  timer = setTimeout(function() {
    var d = new Date(); d.setDate(d.getDate() - 10);
    var st = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    var ctrl = new AbortController();
    setTimeout(function() { ctrl.abort(); }, 3500);

    fetch('https://finmindtrade.com' + code + '&start_date=' + st, { signal: ctrl.signal })
      .then(function(r) { return r.json(); })
      .then(function(j) {
        if (j && j.data && j.data.length > 0) {
          var last = j.data.pop();
          var prev = j.data.length > 0 ? j.data.pop().close : last.open;
          if (last && last.close) {
            elPrice.value = last.close;
            elPrev.value = prev || last.close;
          }
        }
      })
      .catch(function() {});
  }, 300);
}

function onCode() {
  var c = elCode.value.trim().toUpperCase();
  if (c === '') { elName.value = ''; return; }
  if (dict[c]) {
    elName.value = dict[c].name;
    elCat.value = dict[c].cat;
    fetchPrice(c);
  } else if (c.indexOf('00') === 0) {
    elCat.value = 'ETF';
    if (c.length >= 4) fetchPrice(c);
  }
}

function onName() {
  var q = elName.value.trim().toUpperCase();
  if (q === '') { elCode.value = ''; return; }
  if (q.length < 2) return;
  for (var k in dict) {
    if (dict[k].name.toUpperCase().indexOf(q) !== -1) {
      elCode.value = k;
      elCat.value = dict[k].cat;
      fetchPrice(k);
      break;
    }
  }
}

['input', 'change', 'keyup', 'blur'].forEach(function(ev) {
  elCode.addEventListener(ev, onCode);
  elName.addEventListener(ev, onName);
});

function fmt(n, s) {
  var r = Math.round(n), str = Math.abs(r).toLocaleString();
  return s ? (r > 0 ? '+' : r < 0 ? '-' : '') + str : (r < 0 ? '-' : '') + str;
}

function render() {
  var cats = ['全部'];
  stocks.forEach(function(s) { if (cats.indexOf(s.cat) === -1) cats.push(s.cat); });

    return '<button type="button" onclick="setTab(\'' + c + '\')" style="flex:none;background:' + (act?'#F04438':'#262626') + ';color:' + (act?'#FFF':'#AAA') + ';padding:6px 12px;border-radius:15px;font-size:12px;">' + c + '</button>';
  }).join('');

  var dSum = 0, vSum = 0, cSum = 0, html = '';
  stocks.forEach(function(it, i) {
    if (curTab !== '全部' && it.cat !== curTab) return;
    var val = it.price * it.shares, dPL = (it.price - it.prev) * it.shares, totPL = val - it.cost;
