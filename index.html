<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>台股即時損益看板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0D0D0D; color: #FFF; font-family: sans-serif; padding: 12px; max-width: 460px; margin: 0 auto; padding-bottom: 40px; }
  .bar { display: flex; justify-content: space-between; font-size: 11px; color: #9CA3AF; margin-bottom: 8px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #FBBF24; margin-right: 4px; }
  .box { background: #1E1E1E; border: 1px solid #333; padding: 14px; border-radius: 10px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  input, select { background: #121212; border: 1px solid #444; color: #FFF; padding: 9px; border-radius: 6px; width: 100%; font-size: 14px; }
  .hl { border-color: #FBBF24; }
  .btns { display: flex; gap: 8px; }
  button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; }
  .btn-red { background: #F04438; color: #FFF; }
  .btn-live { background: #262626; color: #FBBF24; border: 1px solid #524118; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
  .sum { display: grid; grid-template-columns: 1fr 1fr 1fr; background: #1A1A1A; padding: 12px; border-radius: 10px; margin-bottom: 10px; text-align: center; }
  .row { display: grid; grid-template-columns: 3.4fr 2.4fr 2fr 2.4fr; align-items: center; padding: 12px 4px; border-bottom: 1px solid #262626; font-size: 14px; }
</style>
</head>
<body>

<div class="bar">
  <div><span id="dot" class="dot"></span><span id="status">連線證交所資料中...</span></div>
  <div>v3.0</div>
</div>

<div class="box">
  <div style="font-size:14px;font-weight:bold;color:#FBBF24;margin-bottom:8px;">➕ 新增我的個股</div>
  <div class="grid">
    <input type="text" id="inName" class="hl" list="nOpts" placeholder="輸入股名 (如: 富采)">
    <input type="text" id="inCode" class="hl" list="cOpts" placeholder="輸入代號 (如: 3714)">
    <datalist id="nOpts"></datalist>
    <datalist id="cOpts"></datalist>
    <select id="inCat">
      <option value="半導體">📁 半導體</option>
      <option value="AI電子">📁 AI / 電子</option>
      <option value="面板光電">📁 面板 / 光電</option>
      <option value="ETF">📁 ETF 基金</option>
      <option value="金融股">📁 金融股</option>
      <option value="航運傳產">📁 航運 / 傳產</option>
      <option value="其他">📁 其他自訂</option>
    </select>
    <input type="number" id="inShares" placeholder="股數 (1張=1000)">
    <input type="number" id="inCost" placeholder="買進總成本">
    <input type="number" step="0.01" id="inPrice" placeholder="目前股價 (自動抓)">
    <input type="number" step="0.01" id="inPrev" placeholder="昨日收盤價 (自動抓)" style="grid-column:span 2;">
  </div>
  <div class="btns">
    <button type="button" id="btnAdd" class="btn-red">確認加入</button>
    <button type="button" id="btnSync" class="btn-live">🔄 連網更新股價</button>
  </div>
</div>

<div id="tabs" class="tabs"></div>

<div class="sum">
  <div><div style="font-size:11px;color:#888;">今日損益</div><div id="sDay" style="font-size:17px;font-weight:bold;">+0</div></div>
  <div><div style="font-size:11px;color:#888;">累積損益</div><div id="sTot" style="font-size:17px;font-weight:bold;">0</div></div>
  <div><div style="font-size:11px;color:#888;">股票市值</div><div id="sVal" style="font-size:17px;font-weight:bold;">0</div></div>
</div>

<div style="display:grid;grid-template-columns:3.4fr 2.4fr 2fr 2.4fr;padding:6px;border-bottom:1px solid #333;color:#888;font-size:12px;">
  <div>庫存股 / 群組</div><div style="text-align:right;">今日損益</div><div style="text-align:right;">現價/漲跌</div><div style="text-align:right;">總損益</div>
</div>
<div id="list"></div>

<script>
var dict = {
  '3714': { name: '富采', cat: '面板光電', price: 42.5, prev: 41.0 },
  '3481': { name: '群創', cat: '面板光電', price: 15.8, prev: 15.5 },
  '2409': { name: '友達', cat: '面板光電', price: 16.5, prev: 16.2 },
  '2330': { name: '台積電', cat: '半導體', price: 1050, prev: 1035 },
  '3711': { name: '日月光投控', cat: '半導體', price: 165, prev: 162 },
  '2317': { name: '鴻海', cat: 'AI電子', price: 210, prev: 206 },
  '0050': { name: '元大台灣50', cat: 'ETF', price: 195, prev: 193 },
  '00878': { name: '國泰永續高股息', cat: 'ETF', price: 22.8, prev: 22.6 },
  '00919': { name: '群益台灣精選高息', cat: 'ETF', price: 23.5, prev: 23.3 },
  '009816': { name: '凱基台灣TOP50', cat: 'ETF', price: 14.16, prev: 12.88 }
};

var colors = { '半導體':'#3B82F6','AI電子':'#8B5CF6','面板光電':'#06B6D4','ETF':'#F59E0B','金融股':'#EC4899','航運傳產':'#10B981','其他':'#6B7280' };
var stocks = JSON.parse(localStorage.getItem('twStocksV3')) || [
  { name: '富采', code: '3714', cat: '面板光電', shares: 1000, price: 42.5, prev: 41.0, cost: 40000 },
  { name: '群創', code: '3481', cat: '面板光電', shares: 1000, price: 15.8, prev: 15.5, cost: 15000 }
];
var curTab = '全部';

function fillLists() {
  var nH = '', cH = '';
  for (var k in dict) {
    nH += '<option value="' + dict[k].name + '">';
    cH += '<option value="' + k + '">';
  }
  document.getElementById('nOpts').innerHTML = nH;
  document.getElementById('cOpts').innerHTML = cH;
}

// 連線台灣證交所官方 OpenAPI 抓取全台上市股票與 ETF 最新收盤價 (極速秒抓)
function loadTwseAll() {
  fetch('https://twse.com.tw')
    .then(function(r) { return r.json(); })
    .then(function(arr) {
      if (arr && arr.length > 100) {
        var cnt = 0;
        arr.forEach(function(item) {
          var code = item.Code, name = item.Name;
          var close = parseFloat(item.ClosingPrice);
          var diff = parseFloat(item.Change);
          if (code && name && !isNaN(close)) {
            var prev = !isNaN(diff) ? Number((close - diff).toFixed(2)) : close;
            var cat = dict[code] ? dict[code].cat : (code.indexOf('00') === 0 ? 'ETF' : '其他');
            dict[code] = { name: name, cat: cat, price: close, prev: prev };
            cnt++;
          }
        });
        fillLists();
        document.getElementById('dot').style.background = '#12B76A';
        document.getElementById('status').innerText = '已連網同步證交所 (' + cnt + '檔)';
      }
    })
    .catch(function() {
      document.getElementById('dot').style.background = '#12B76A';
      document.getElementById('status').innerText = '就緒 (內建字典模式)';
    });
}

var elName = document.getElementById('inName');
var elCode = document.getElementById('inCode');
var elCat = document.getElementById('inCat');
var elPrice = document.getElementById('inPrice');
var elPrev = document.getElementById('inPrev');

function onCode() {
  var c = elCode.value.trim().toUpperCase();
  if (c === '') { elName.value = ''; return; }
  if (dict[c]) {
    elName.value = dict[c].name;
    elCat.value = dict[c].cat;
    if (dict[c].price) elPrice.value = dict[c].price;
    if (dict[c].prev) elPrev.value = dict[c].prev;
  } else if (c.indexOf('00') === 0) {
    elCat.value = 'ETF';
  }
}

function onName() {
  var q = elName.value.trim().toUpperCase();
  if (q === '') { elCode.value = ''; return; }
  if (q.length < 2) return;
  for (var k in dict) {
    if (dict[k].name.toUpperCase().indexOf(q) !== -1) {
      elCode.value = k;
      elCat.value = dict[k].cat;
      if (dict[k].price) elPrice.value = dict[k].price;
      if (dict[k].prev) elPrev.value = dict[k].prev;
      break;
    }
  }
}

['input', 'change', 'keyup', 'blur'].forEach(function(ev) {
  elCode.addEventListener(ev, onCode);
  elName.addEventListener(ev, onName);
});

function fmt(n, s) {
  var r = Math.round(n), str = Math.abs(r).toLocaleString();
  return s ? (r > 0 ? '+' : r < 0 ? '-' : '') + str : (r < 0 ? '-' : '') + str;
}

function render() {
  var cats = ['全部'];
  stocks.forEach(function(s) { if (cats.indexOf(s.cat) === -1) cats.push(s.cat); });
  document.getElementById('tabs').innerHTML = cats.map(function(c) {
    var act = curTab === c;
    return '<button type="button" onclick="setTab(\'' + c + '\')" style="flex:none;background:' + (act?'#F04438':'#262626') + ';color:' + (act?'#FFF':'#AAA') + ';padding:6px 12px;border-radius:15px;font-size:12px;">' + c + '</button>';
  }).join('');

  var dSum = 0, vSum = 0, cSum = 0, html = '';
  stocks.forEach(function(it, i) {
    if (curTab !== '全部' && it.cat !== curTab) return;
    var val = it.price * it.shares, dPL = (it.price - it.prev) * it.shares, totPL = val - it.cost;
    var pct = it.prev > 0 ? ((it.price - it.prev) / it.prev) * 100 : 0;
    dSum += dPL; vSum += val; cSum += it.cost;
    var c1 = dPL >= 0 ? '#F04438' : '#12B76A', c2 = totPL >= 0 ? '#F04438' : '#12B76A';

    html += '<div class="row">' +
      '<div><strong>' + it.name + '</strong> <span style="background:' + (colors[it.cat]||'#555') + ';font-size:10px;padding:1px 4px;border-radius:3px;">' + it.cat + '</span><br>' +
      '<span style="font-size:11px;color:#888;">' + it.code + ' (' + it.shares + '股)</span> <span onclick="delItem(' + i + ')" style="background:#333;color:#AAA;font-size:10px;padding:1px 5px;border-radius:3px;cursor:pointer;">刪除</span></div>' +
      '<div style="text-align:right;color:' + c1 + ';font-weight:bold;">' + fmt(dPL, true) + '</div>' +
      '<div style="text-align:right;"><span style="background:' + c1 + ';padding:2px 6px;border-radius:4px;font-size:12px;font-weight:bold;">' + it.price + '</span><br><span style="color:' + c1 + ';font-size:11px;">' + (pct>=0?'+':'') + pct.toFixed(2) + '%</span></div>' +
      '<div style="text-align:right;color:' + c2 + ';font-weight:bold;">' + fmt(totPL, true) + '</div></div>';
  });

  var acc = vSum - cSum;
  document.getElementById('sDay').innerText = fmt(dSum, true);
  document.getElementById('sDay').style.color = dSum >= 0 ? '#F04438' : '#12B76A';
  document.getElementById('sTot').innerText = fmt(acc, true);
  document.getElementById('sTot').style.color = acc >= 0 ? '#F04438' : '#12B76A';
  document.getElementById('sVal').innerText = fmt(vSum, false);
