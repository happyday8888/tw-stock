var dict = {};
db.split("|").forEach(function(r) {
  var p = r.split(":");
  var c = p.shift(), n = p.shift(), cat = p.shift();
  dict[c] = { name: n, cat: cat };
});

// 透過 Yahoo 財經 API (經由穩定跨域代理) 查詢單一或多檔台股即時/收盤價
function queryYahooQuotes(codeArray, callback) {
  if (!codeArray || codeArray.length === 0) { callback({}); return; }
  // 同時帶入 .TW (上市) 與 .TWO (上櫃)
  var symbols = [];
  codeArray.forEach(function(c) {
    symbols.push(c + '.TW');
    symbols.push(c + '.TWO');
  });
  var targetUrl = 'https://yahoo.com' + symbols.join(',');
  var proxyUrl = 'https://codetabs.com' + encodeURIComponent(targetUrl);

  fetch(proxyUrl)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var map = {};
      if (data && data.quoteResponse && data.quoteResponse.result) {
        data.quoteResponse.result.forEach(function(q) {
          if (q.symbol && q.regularMarketPrice) {
            var pureCode = q.symbol.replace('.TWO', '').replace('.TW', '');
            map[pureCode] = {
              price: Number(q.regularMarketPrice.toFixed(2)),
              prev: q.regularMarketPreviousClose ? Number(q.regularMarketPreviousClose.toFixed(2)) : Number(q.regularMarketPrice.toFixed(2))
            };
          }
        });
      }
      callback(map);
    })
    .catch(function() {
      // 備援：改用 allorigins 代理
      var backupProxy = 'https://allorigins.win' + encodeURIComponent(targetUrl);
      fetch(backupProxy)
        .then(function(r) { return r.json(); })
        .then(function(res) {
          var map = {};
          if (res && res.contents) {
            var parsed = JSON.parse(res.contents);
            if (parsed.quoteResponse && parsed.quoteResponse.result) {
              parsed.quoteResponse.result.forEach(function(q) {
                if (q.symbol && q.regularMarketPrice) {
                  var pureCode = q.symbol.replace('.TWO', '').replace('.TW', '');
                  map[pureCode] = {
                    price: Number(q.regularMarketPrice.toFixed(2)),
                    prev: q.regularMarketPreviousClose ? Number(q.regularMarketPreviousClose.toFixed(2)) : Number(q.regularMarketPrice.toFixed(2))
                  };
                }
              });
            }
          }
          callback(map);
        })
        .catch(function() { callback({}); });
    });
}

var priceTimer = null;
function autoPrice(code) {
  if (!code || code.length < 4) return;
  clearTimeout(priceTimer);
  priceTimer = setTimeout(function() {
    document.getElementById('inPrice').placeholder = '⏳ 抓報價中...';
    queryYahooQuotes([code], function(map) {
      document.getElementById('inPrice').placeholder = '目前股價 (自動抓)';
      if (map[code]) {
        document.getElementById('inPrice').value = map[code].price;
        document.getElementById('inPrev').value = map[code].prev;
      }
    });
  }, 350);
}

function syncFromCode(val) {
  var c = val.trim().toUpperCase();
  var elName = document.getElementById('inName');
  var elCat = document.getElementById('inCat');
  if (c === '') { elName.value = ''; return; }
  if (dict[c]) {
    elName.value = dict[c].name;
    elCat.value = dict[c].cat;
    autoPrice(c);
  } else if (c.indexOf('00') === 0) {
    elCat.value = 'ETF';
    if (c.length >= 4) autoPrice(c);
  }
}

function syncFromName(val) {
  var q = val.trim().toUpperCase();
  var elCode = document.getElementById('inCode');
  var elCat = document.getElementById('inCat');
  if (q === '') { elCode.value = ''; return; }
  if (q.length < 2) return;
  for (var k in dict) {
    if (dict.hasOwnProperty(k) && dict[k].name.toUpperCase().indexOf(q) !== -1) {
      elCode.value = k;
      elCat.value = dict[k].cat;
      autoPrice(k);
      break;
    }
  }
}
